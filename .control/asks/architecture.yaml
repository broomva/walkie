# Ask ledger — walkie architecture (BRO-2362)
# Every input the arc needs that only a person can supply. Checked at hour 0
# against what is already on the machine, so nothing already satisfied is asked.
arc: walkie-architecture
ticket: BRO-2362
tz: America/Bogota

satisfied:
  - id: openai-key
    class: credential
    note: OPENAI_API_KEY present in the environment. Realtime path unblocked.
  - id: elevenlabs-key
    class: credential
    note: ELEVENLABS_API_KEY in the workspace .env.local. Already used by talkback.
  - id: build-tooling
    class: artifact
    note: bun 1.3.14, railway 4.31.0, eas-cli 16.32.0 installed.
  - id: github-remote
    class: authority
    note: >-
      RESOLVED 2026-08-30 by the operator — github.com/broomva/walkie, PUBLIC.
      Matches genesis and maestro. Pre-publish gate ran the full history; the only
      gitleaks finding is the known .pen fileToken (benign, and the repo's own
      verify-gitleaks-allowlist.sh passes both polarities), no phone numbers, no
      emails, and every xi-api-key occurrence is a header name reading from the
      environment. MIT LICENSE added before publishing, since the repo had none and
      public design work with no license is legally ambiguous.

asks:
  - id: apple-signing
    class: credential
    gates: [native client on device, push notifications, background audio]
    question: Is there an Apple Developer account available for signing and APNs?
    finding: security find-identity reports 0 valid codesigning identities
    default: prototype as a web client first; it exercises the same WebRTC and SSE
      code paths and needs no signing
    reversible: yes, the client is the last layer to harden
    exhausted: [read, standing-grant, delegate, reroute, loop, default]

  - id: elevenlabs-key-quota
    class: credential
    gates: [audio probes that synthesize via the vendor; any production TTS volume]
    question: The API key named "broomva" carries a per-key quota of 10 credits and
      had 3 left. Raise it, or issue an uncapped key?
    finding: the ACCOUNT shows 3,600 of 130,958 characters used, so the
      subscription endpoint gives no hint that a key-level cap exists. The failure
      only appears mid-request as quota_exceeded naming the key.
    workaround_taken: the audio probe now synthesizes its test speech locally with
      say + ffmpeg instead of the vendor's TTS, so it consumes no key quota at
      all. That is better probe design regardless of the cap.
    default: leave the cap alone; nothing in the validated path needs vendor TTS
    reversible: yes
    exhausted: [read, standing-grant, delegate, reroute, loop, default]

superseded_verdicts:
  - id: voice-vendor
    was: >-
      OpenAI Realtime — "ElevenLabs gates server-side injection behind an
      enterprise plan and bills idle connection wall-clock."
    now: >-
      ElevenLabs. The reasoning was sound and the premise stopped applying —
      pause-and-resume makes server-side injection unnecessary, so the enterprise
      gate is not on the path. The probe then closed the loop 10/10 with real
      audio (BRO-2364), integrations/ carries only elevenlabs, and the Swift SDK
      is first-party where every Rust crate is unofficial. OpenAI is additionally
      credit_balance_exhausted on this account.
    lesson: >-
      a verdict written before the probe is a forecast; a measurement beats
      it regardless of how well argued it was.

  - id: native-client-path
    was: >-
      Expo dev-client + Apple PushToTalk for the actual product.
    now: >-
      SwiftUI, and PushToTalk is the GESTURE not the framework. No Expo
      PushToTalk module exists, so that path writes the Swift anyway and pays a
      bridge on top. The framework itself is not adopted in v1: it enforces
      half-duplex and its own system UI, which kills the barge-in the interface
      is built around. Plain AVAudioSession + hold-to-talk keeps full duplex;
      wake-from-terminated is knowingly given up and PTT stays additive later.
    still_true: >-
      the PWA limits below — cannot play a readback or capture mic
      backgrounded, cannot wake from terminated, and Safari revokes push
      permission if a push is not user-visible. That is why step 5 exists.

  - id: openai-credits
    was: >-
      Add OpenAI credit, or commit to ElevenLabs for the voice layer?
    now: >-
      RESOLVED with the vendor call — ElevenLabs. The finding that made this an
      ask still stands and is worth keeping: minting an ephemeral client secret
      returns HTTP 200 on an exhausted account, so a 200 from
      /v1/realtime/client_secrets is not a usable-session signal. The failure
      only appears when the session opens.

  - id: railway-auth
    was: >-
      railway login needed before any deploy step.
    now: >-
      MOOT for this service. The declared architecture keeps Genesis
      host-resident, so there is no Railway deploy on walkie's path. Railway
      remains the house default for ordinary services; this one is a named
      exception because the workspace read paths are filesystem-bound and
      subscription OAuth requires owned compute.

  - id: router-host
    was: >-
      VPS (srv1692698) vs local Mac vs cloud — deferred.
    now: >-
      RESOLVED — the owned host, running LocalHost, API and sessions co-resident.
      Not a preference. workspace-fs.ts, workspace-browse.ts and workspace-git.ts
      each read through Node fs because the API and the workspaces share a
      filesystem ("the VPS deploy is LocalHost-only"), and non-owned compute
      cannot carry subscription OAuth. Genesis already ships the seam —
      ExecutionHost with LocalHost / VpsHost / VercelSandboxHost and the
      credential tier encoded in the type — so this was never walkie's decision
      to make.

decisions:
  - id: no-messaging-socket
    taken: REVERSED. CLAUDE_CODE_MESSAGING_SOCKET was excluded as undocumented.
    correction: cross-session messaging is DOCUMENTED and GA (v2.1.224+), and the
      docs explicitly sanction a script or hook posting into a session. Proven
      end-to-end here from a non-Claude process. The exclusion was my error.
    caveat: a receiver on bypass-permissions HOLDS messages from a sender that
      cannot attest its permission class, and drops them after five minutes.
    undo: n/a — already reversed.
  - id: voice-not-brain
    taken: the realtime model owns capture and speech only. STILL HOLDS.
    why: a turn runs 9s-10min and a realtime call will not hold for it.
    undo: one commit.
  - id: router-is-a-service-not-a-session
    taken: the routing layer is a plain restartable service with state in
      Postgres, NOT a long-lived Claude Code session.
    why: session.update swaps tools mid-call, so the router's original
      justification is gone; and one session serializes all workspaces behind a
      single turn chain while compaction destroys ticket bindings silently.
    undo: one commit.

  - id: ptt-entitlement-approval
    class: authority
    gates: [the native client, i.e. the actual product]
    question: In the Apple developer portal, is com.apple.developer.push-to-talk
      grantable directly or does it require an Apple capability request?
    finding: NOT STATED in Apple's docs. The setup guide says to add it in Xcode
      directly, which suggests ungated, but the capability-requests page does not
      enumerate which capabilities are managed.
    why_it_matters: if it needs Apple approval with a justification, that is a
      schedule item and must be started early, not discovered at build time.
    default: prove the interaction loop on the PWA first; nothing about that work
      is wasted, and it is what tells us whether the native spend is warranted
    reversible: yes
    exhausted: [read, standing-grant, delegate, reroute, loop, default]

hazards:
  - id: ptt-transmission-requires-foreground
    note: PushToTalk lets the agent's readback reach you while the phone is
      pocketed, but INITIATING transmission requires the app in the foreground or
      a PTTAccessory / headset play-pause button, which the system maps to
      begin-end transmission. "Hold to talk without taking the phone out" is a
      headset-button feature, not a screen-button one. This changes the product,
      not just the implementation.
  - id: pushkit-is-the-wrong-path
    note: PushKit requires CallKit (iOS 13+ SDK), the system TERMINATES an app
      that fails to report a call, and App Store 2.5.4 is a purpose test that
      using VoIP push for agent readbacks would fail. PushToTalk is the sanctioned
      analogue. Do not route this product through PushKit.
  - id: expo-av-removed
    note: expo-av is removed in SDK 55; use expo-audio. react-native-webrtc cannot
      run in Expo Go. No Expo PushToTalk module exists — writing one is the single
      largest unbudgeted item in the native path.
  - id: anthropic-key-forces-api-billing
    note: ANTHROPIC_API_KEY is present in the workspace .env.local. If it is exported
      into the router host's environment, that session bills API credits instead
      of the subscription. The router host must NOT export it.
